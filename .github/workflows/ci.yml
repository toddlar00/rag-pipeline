name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-test.lock
      - name: Install test tools
        run: python -m pip install --require-hashes -r requirements-test.lock
      - name: Check dependency policy
        run: python tools/check_dependency_policy.py
      - name: Check model artifact policy
        run: python tools/check_model_artifacts.py
      - name: Lint
        run: python -m ruff check .
      - name: Compile Python sources
        run: >-
          python -m py_compile
          rag.py process_supervision.py retrieval_core.py artifact_io.py
          chunking_core.py cli_policy.py
          ingestion_core.py index_state.py llm_adapters.py model_artifacts.py
          operation_contracts.py run_telemetry.py storage_policy.py retention.py
          job_runtime.py job_manager.py supervised_worker.py
          service_contracts.py service_runtime.py service_api.py
          eval.py evaluation_metrics.py offline_retrieval.py
          llm_runtime.py preprocess_pdf.py
          scaffold_to_markdown.py inspect_chunks.py ui.py
          tools/check_dependency_policy.py tools/check_licenses.py
          tools/check_model_artifacts.py tools/check_vulnerabilities.py
          tools/refresh_locks.py tools/refresh_model_artifacts.py
      - name: Check GPU setup shell syntax
        run: bash -n setup_rtx5060.sh

  evaluation-smoke:
    name: Offline retrieval regression suites
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-test.lock
      - name: Install dependency-light evaluation environment
        run: python -m pip install --require-hashes -r requirements-test.lock
      - name: Evaluate Property mini corpus
        run: >-
          python eval.py --retriever bm25
          --queries evaluation/suites/property/queries.jsonl
          --chunks evaluation/suites/property/chunks.jsonl
          --k 1 3 5 --depth 10
          --json-report evaluation-reports/property.json
          --baseline-report evaluation/baselines/property-bm25.json
          --fail-under success@1=0.95
          --fail-under ndcg@3=0.95
          --fail-under abstention_accuracy=1
          --fail-under filter_compliance=1
          --fail-under grounding_accuracy=1
          --fail-under slice/tag/citation/success@1=1
          --fail-under slice/tag/long_context/success@1=1
          --fail-over false_answer_rate=0
          --max-regression success@1=0
          --max-regression ndcg@3=0
          --max-regression abstention_accuracy=0
          --max-regression grounding_accuracy=0
      - name: Evaluate Constitutional Law mini corpus
        run: >-
          python eval.py --retriever bm25
          --queries evaluation/suites/constitutional_law/queries.jsonl
          --chunks evaluation/suites/constitutional_law/chunks.jsonl
          --k 1 3 5 --depth 10
          --json-report evaluation-reports/constitutional-law.json
          --baseline-report evaluation/baselines/constitutional-law-bm25.json
          --fail-under success@1=0.95
          --fail-under ndcg@3=0.95
          --fail-under type_accuracy=0.8
          --fail-under abstention_accuracy=1
          --fail-under filter_compliance=1
          --fail-under grounding_accuracy=1
          --fail-under slice/tag/lexical_distractor/ndcg@3=0.79
          --fail-over false_answer_rate=0
          --max-regression success@1=0
          --max-regression ndcg@3=0
          --max-regression abstention_accuracy=0
          --max-regression grounding_accuracy=0
      - name: Retain redacted evaluation reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: offline-retrieval-evaluation
          path: evaluation-reports/*.json
          if-no-files-found: warn
          retention-days: 30

  unit-linux:
    name: Unit tests / Python ${{ matrix.python-version }} / Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-test.lock
      - name: Install test dependencies
        run: python -m pip install --require-hashes -r requirements-test.lock
      - name: Run dependency-light suite
        run: python -m pytest -q

  unit-windows:
    name: Unit tests / Python 3.12 / Windows
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-test.lock
      - name: Install test dependencies
        run: python -m pip install --require-hashes -r requirements-test.lock
      - name: Run Windows supervision regressions
        run: python -m pytest -q

  service-api:
    name: Local service API / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-test.lock
            requirements-service.lock
      - name: Install the hash-locked service runtime
        run: python -m pip install --require-hashes -r requirements-service.lock
      - name: Verify the service-only dependency boundary
        run: >-
          python -c
          "import fastapi, qdrant_client, requests, uvicorn;
          import rag, service_contracts, service_runtime, service_api"
      - name: Add hash-locked test tools
        run: python -m pip install --require-hashes -r requirements-test.lock
      - name: Exercise contracts, runtime, HTTP, and live loopback service
        run: >-
          python -m pytest -q
          tests/test_service_contracts.py tests/test_service_runtime.py
          tests/test_service_api.py tests/test_service_live.py
          tests/test_job_runtime.py

  vector-store-smoke:
    name: Real vector stores / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-smoke.lock
      - name: Install local vector clients
        run: python -m pip install --require-hashes -r requirements-smoke.lock
      - name: Require both real vector clients
        run: python -c "import chromadb, qdrant_client"
      - name: Exercise real Chroma and Qdrant clients
        run: >-
          python -m pytest -q
          tests/test_vector_store_lock_release.py tests/test_index_manifests.py
          -k "local_vector_store_releases_lock or qdrant_update_validates_public_status_enum"

  full-integration:
    name: Full CPU environment / Python 3.12 / Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-full.lock
            requirements-test.lock
            requirements-lock-tools.lock
      - name: Install hash-locked bootstrapper
        run: python -m pip install --require-hashes -r requirements-lock-tools.lock
      - name: Install the full locked CPU environment
        run: >-
          uv pip install --system --torch-backend cpu --require-hashes
          -r requirements-full.lock -r requirements-test.lock
      - name: Verify installed dependency consistency
        run: python -m pip check
      - name: Run the complete suite
        run: python -m pytest -q
