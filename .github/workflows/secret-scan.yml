name: Secret scan

on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  schedule:
    - cron: "43 9 * * 4"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

env:
  GIT_NO_REPLACE_OBJECTS: "1"
  PYTHONUTF8: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  tracked-scan:
    name: Tracked tree secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Scan every tracked file
        run: >-
          python tools/check_secrets.py
          --policy secret-scan-policy.json
          --mode tracked
          --output-envelope secret-scan-envelope.json
      - name: Prove the deployed gate detects and redacts a live canary
        run: |
          canary_body="$(python -c 'import secrets; print(secrets.token_hex(20))')"
          canary="ghp_${canary_body}"
          printf '%s\n' "$canary" > "$RUNNER_TEMP/live-fire-canary.txt"
          set +e
          python tools/check_secrets.py \
            --policy secret-scan-policy.json \
            --scan-file "$RUNNER_TEMP/live-fire-canary.txt" \
            > "$RUNNER_TEMP/live-fire.log" 2>&1
          status=$?
          set -e
          if [ "$status" -ne 1 ]; then
            echo "live-fire canary was not detected (status $status)"
            exit 1
          fi
          if grep -qF "$canary_body" "$RUNNER_TEMP/live-fire.log"; then
            echo "live-fire output leaked matched bytes"
            exit 1
          fi
          echo "live-fire canary detected with redacted output"
      - name: Retain the tracked scan envelope
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: secret-scan-tracked-envelope
          path: secret-scan-envelope.json
          if-no-files-found: error
          retention-days: 30

  history-scan:
    name: Full history secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    if: ${{ github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Check out repository with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Scan every blob reachable from any ref
        run: >-
          python tools/check_secrets.py
          --policy secret-scan-policy.json
          --mode history
          --output-envelope secret-scan-history-envelope.json
      - name: Retain the history scan envelope
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: secret-scan-history-envelope
          path: secret-scan-history-envelope.json
          if-no-files-found: error
          retention-days: 30
