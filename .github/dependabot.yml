version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: America/Denver
    open-pull-requests-limit: 10
    groups:
      pdf-docling:
        patterns: ["docling", "docling-core", "pymupdf", "pypdfium2"]
      vector-stores:
        patterns: ["chromadb", "onnxruntime", "qdrant-client"]
      ml-runtime:
        patterns: ["einops", "flagembedding", "numpy", "rank-bm25", "sentence-transformers", "torch", "torchvision", "tqdm"]
      service-ui:
        patterns: ["fastapi", "gradio", "uvicorn"]
      provider-transport:
        patterns: ["google-genai", "requests"]
      test-audit-tooling:
        patterns: ["pip", "pip-audit", "pip-licenses", "pytest", "ruff", "uv"]
    commit-message:
      prefix: deps

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "08:30"
      timezone: America/Denver
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: ci

  - package-ecosystem: npm
    directory: "/tools/zettlr-markdown-validator"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Denver
    open-pull-requests-limit: 5
    groups:
      zettlr-markdown-validator:
        patterns: ["*"]
    commit-message:
      prefix: deps
